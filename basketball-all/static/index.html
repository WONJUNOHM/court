<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1ec">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="코트 한눈에">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<title>코트 한눈에</title>
<style>
:root{
  --bg:#fff;--s1:#f5f6f8;--s2:#eceef2;--line:#eceef1;--ink:#17191d;--sub:#6f7782;--faint:#aab0b9;
  --accent:#e8470c;--accent-soft:#fff1eb;--on:#fff;
  --calm:#0f9d58;--calm-soft:#e6f6ee;--mid:#d97706;--mid-soft:#fff4de;--busy:#dc2626;--busy-soft:#fdeaea;--unk:#8b929c;--unk-soft:#eff0f3;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);letter-spacing:-.015em;word-break:keep-all;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(86px + env(safe-area-inset-bottom));background:var(--bg)}
@media (min-width:520px){body{background:#e9ebef}.app{box-shadow:0 0 0 1px var(--line)}}
.n{font-variant-numeric:tabular-nums}

/* 상단·하단 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{font-weight:800;font-size:19px;letter-spacing:-.04em;flex:1;display:flex;align-items:center;gap:7px}
.brand i{width:20px;height:20px;border-radius:50%;background:var(--accent);display:inline-block;position:relative}
.brand i:before{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(90deg,transparent 46%,rgba(255,255,255,.9) 46% 54%,transparent 54%)}
.ib{height:36px;min-width:36px;padding:0 8px;display:grid;place-items:center;border-radius:18px;font-weight:700;font-size:13px;color:var(--ink)}
.ib:active{background:var(--s1)}
.ib svg{width:22px;height:22px}
.ib.me{background:var(--s1);padding:0 13px}
.ttl{font-weight:800;font-size:17px;flex:1;letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.nav>div{pointer-events:auto;width:100%;max-width:480px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11px;font-weight:600;color:var(--faint);position:relative;text-align:center}
.nav svg{width:24px;height:24px}
.nav button.on{color:var(--ink)}
.nav button.on svg{color:var(--accent)}
.nav b{position:absolute;top:-1px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--on);font-size:10.5px;display:grid;place-items:center;padding:0 4px}

/* 공통 */
.pad{padding:0 16px}
.h1{margin:6px 16px 0;font-size:25px;line-height:1.3;font-weight:800;letter-spacing:-.045em}
.lead{margin:6px 16px 0;font-size:14px;color:var(--sub)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:18px;border:1px solid var(--s2);font-weight:600;font-size:14px;color:var(--ink);background:var(--bg);display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.acc.on{background:var(--accent);border-color:var(--accent)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:30px 16px 0}
.sec h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.04em}
.sec h3 em{font-style:normal;color:var(--accent);margin-left:5px}
.sec button{font-size:13px;font-weight:600;color:var(--sub)}
.hint{margin:6px 16px 0;font-size:12.5px;color:var(--sub);line-height:1.6}
.sep{height:8px;background:var(--s1);margin:26px 0 0}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;font-size:11.5px;font-weight:700;background:var(--s1);color:var(--sub)}
.tag.calm{background:var(--calm-soft);color:var(--calm)}.tag.mid{background:var(--mid-soft);color:var(--mid)}.tag.busy{background:var(--busy-soft);color:var(--busy)}.tag.unk{background:var(--unk-soft);color:var(--unk)}.tag.acc{background:var(--accent-soft);color:var(--accent)}
.calm{color:var(--calm)}.mid{color:var(--mid)}.busy{color:var(--busy)}.unk{color:var(--unk)}
.empty{padding:44px 16px;text-align:center;color:var(--sub);font-size:14px}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px;letter-spacing:-.03em}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:12px;background:var(--accent);color:var(--on);font-weight:800;font-size:16px;letter-spacing:-.02em}
.btn:active{filter:brightness(.94)}
.btn.line{background:var(--bg);color:var(--ink);border:1px solid var(--s2)}
.btn.dark{background:var(--ink)}
.btn.sm{height:46px;font-size:15px;border-radius:10px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(82px + env(safe-area-inset-bottom));z-index:25;background:var(--ink);color:var(--bg);height:48px;padding:0 20px 0 16px;border-radius:24px;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px rgba(0,0,0,.22)}

/* 홈: 추천 카드 + 코트 목록 */
.pick{margin:8px 16px 0;border-radius:18px;background:var(--s1);display:flex;overflow:hidden;align-items:stretch;min-height:116px}
.pick .tx{flex:1;padding:16px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.pick small{font-size:12.5px;color:var(--sub);font-weight:600}
.pick strong{display:block;font-size:19px;line-height:1.3;font-weight:800;letter-spacing:-.04em;margin:3px 0 6px}
.pick .tx div{font-size:13.5px}
.pick img{width:118px;object-fit:cover;filter:grayscale(.1)}
.crow{display:block;width:100%;padding:18px 16px;border-bottom:1px solid var(--line)}
.crow:active{background:var(--s1)}
.crow .r1{display:flex;align-items:center;gap:8px}
.cn{font-weight:700;font-size:17px;letter-spacing:-.035em;flex:1;min-width:0}
.cm{font-size:13px;color:var(--sub);margin-top:4px}
.cm em{font-style:normal;color:var(--accent);font-weight:700}
.cnum{font-size:15px;font-weight:800;white-space:nowrap}
.seg{display:flex;gap:3px;margin-top:12px}
.seg i{flex:1;height:6px;background:var(--s2);border-radius:3px}
.seg.calm i.f{background:var(--calm)}.seg.mid i.f{background:var(--mid)}.seg.busy i.f{background:var(--busy)}.seg.unk i.f{background:var(--unk)}
.seg.lg i{height:10px;border-radius:5px}
.notes{padding:18px 16px;font-size:12.5px;color:var(--sub);line-height:1.7}

/* 코트 상세 */
.sum{margin:6px 16px 0;padding:20px;border-radius:20px;background:var(--s1)}
.sum .top1{display:flex;align-items:center;justify-content:space-between}
.sum .area{font-size:13px;color:var(--sub);font-weight:600}
.bigrow{display:flex;align-items:baseline;gap:6px;margin-top:12px}
.bigrow b{font-size:68px;line-height:1;font-weight:800;letter-spacing:-.06em}
.bigrow span{font-size:20px;font-weight:700;color:var(--sub)}
.sum .court{margin:16px 0 4px}
.fresh{font-size:13px;color:var(--sub);margin-top:12px}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cond{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 0}
.kv{display:grid;grid-template-columns:70px 1fr;margin:8px 16px 0;font-size:14.5px}
.kv dt,.kv dd{padding:12px 0;border-bottom:1px solid var(--line);margin:0}
.kv dt{color:var(--sub)}.kv dd{font-weight:600}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 16px 0}
.links a,.links span{height:44px;border:1px solid var(--s2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13.5px}
.chart{display:flex;align-items:flex-end;gap:4px;height:100px;margin:16px 16px 0}
.chart i{flex:1;background:var(--s2);min-height:4px;border-radius:3px 3px 0 0}
.chart i.on{background:var(--accent)}
.axis{display:flex;justify-content:space-between;margin:6px 16px 0;color:var(--sub);font-size:11.5px}

/* 게임 */
.dates{display:flex;gap:4px;overflow-x:auto;padding:10px 12px 6px;scrollbar-width:none;position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:15;background:rgba(255,255,255,.96);backdrop-filter:blur(10px)}
.dates::-webkit-scrollbar{display:none}
.dt{flex:none;width:48px;padding:8px 0 7px;border-radius:12px;text-align:center;position:relative}
.dt span{display:block;font-size:11.5px;color:var(--sub);font-weight:600}
.dt b{display:block;font-size:18px;font-weight:700;margin-top:1px}
.dt.sat span,.dt.sat b{color:#2f6bd9}.dt.sun span,.dt.sun b{color:var(--busy)}
.dt.on{background:var(--ink)}.dt.on span,.dt.on b{color:var(--bg)}
.dt i{position:absolute;bottom:3px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.dt.on i{background:var(--bg)}
.tgl{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;font-size:13px;color:var(--sub)}
.sw{width:44px;height:26px;border-radius:13px;background:var(--s2);position:relative;transition:.15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.sw.on{background:var(--accent)}.sw.on:after{left:21px}
.game{padding:18px 16px;border-bottom:1px solid var(--line)}
.g1{display:flex;gap:14px}
.gt{width:54px;flex:none}
.gt b{display:block;font-size:22px;line-height:1.1;font-weight:800;letter-spacing:-.04em}
.gt span{display:block;font-size:12px;color:var(--sub);margin-top:2px;font-weight:600}
.gm{flex:1;min-width:0}
.gm h4{margin:0;font-size:16.5px;line-height:1.4;font-weight:700;letter-spacing:-.035em}
.gm .meta{font-size:13px;color:var(--sub);margin-top:3px}
.meta a{text-decoration:underline;text-underline-offset:2px}
.gm .tg{margin-top:8px}
.gs{flex:none;text-align:right}
.gs .tag{margin-bottom:6px}
.gs small{display:block;font-size:12.5px;color:var(--sub);font-weight:600}
.gs small b{color:var(--ink);font-size:14px}
.pbar{height:4px;background:var(--s2);border-radius:2px;margin:14px 0 10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.pbar.full i{background:var(--faint)}
.names{font-size:13px;color:var(--sub)}
.acts{display:flex;gap:8px;margin-top:12px;align-items:center}
.b{height:40px;padding:0 18px;border-radius:10px;font-weight:700;font-size:14px;border:1px solid var(--s2);display:inline-flex;align-items:center;justify-content:center}
.b.p{background:var(--accent);border-color:var(--accent);color:var(--on);flex:1}
.b.g{flex:1;color:var(--sub)}
.b.t{border:0;color:var(--sub);padding:0 6px;height:32px;font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* 착장 */
.fit{padding:18px 16px;border-bottom:1px solid var(--line)}
.fit .ph{aspect-ratio:4/5;background:var(--s1);margin:0 0 14px;overflow:hidden;border-radius:14px}
.fit .ph img{width:100%;height:100%;object-fit:cover;display:block}
.shoe{font-weight:800;font-size:19px;line-height:1.3;letter-spacing:-.04em}
.shoe small{font-size:13px;color:var(--sub);margin-left:8px;font-weight:600}
.grip{display:flex;align-items:center;gap:3px;margin-top:8px}
.grip span{font-size:12.5px;color:var(--sub);margin-right:7px}
.grip i{width:20px;height:6px;background:var(--s2);border-radius:3px}
.grip i.f{background:var(--accent)}
.outfit{display:grid;grid-template-columns:52px 1fr;margin:12px 0 0;font-size:14px}
.outfit dt{font-size:12.5px;color:var(--sub);font-weight:600;padding:2px 0}
.outfit dd{margin:0;padding:2px 0}
.quote{margin:10px 0 0;font-size:14.5px;line-height:1.6;background:var(--s1);border-radius:10px;padding:10px 12px}
.ft{display:flex;align-items:center;gap:10px;margin-top:12px}
.ft .meta{flex:1;font-size:12.5px;color:var(--sub);min-width:0}
.like{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;border:1px solid var(--s2);border-radius:17px;font-weight:700;font-size:13.5px}
.like svg{width:15px;height:15px}
.like.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.rank{margin:6px 16px 0}
.rk{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rk .no{width:22px;font-weight:800;color:var(--accent);font-size:16px}
.rk b{flex:1;font-weight:700}.rk span{font-size:12.5px;color:var(--sub)}
.guide{margin:12px 16px 0;background:var(--s1);border-radius:14px}
.guide div{padding:14px 16px;font-size:13.5px;color:var(--sub);line-height:1.65}
.guide div+div{border-top:1px solid var(--bg)}
.guide b{display:block;color:var(--ink);margin-bottom:2px}
.banner{margin:6px 16px 0;height:128px;border-radius:18px;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;display:block}

/* 시트 */
.veil{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .16s}
.sheet{background:var(--bg);width:100%;max-width:480px;padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;animation:up .2s ease-out}
.sheet:before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--s2);margin:0 auto 14px}
.sheet h4{margin:0;font-size:21px;letter-spacing:-.045em;font-weight:800}
.sheet .sub{color:var(--sub);font-size:13.5px;margin-top:3px}
.field{display:block;margin-top:16px}
.field>span{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.in{width:100%;background:var(--s1);border:1.5px solid transparent;border-radius:10px;padding:13px;outline:none;font-size:16px}
.in:focus{border-color:var(--accent);background:var(--bg)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{height:40px;padding:0 15px;border-radius:10px;background:var(--s1);font-weight:600;font-size:14px;border:1.5px solid transparent}
.opts button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.step{display:flex;align-items:center;justify-content:center;gap:24px;margin:20px 0 10px}
.step button{width:54px;height:54px;border-radius:50%;background:var(--s1);font-size:26px;font-weight:500;text-align:center}
.step output{font-size:76px;font-weight:800;min-width:110px;text-align:center;letter-spacing:-.06em;line-height:1}
.quick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.quick button{min-width:44px;height:36px;border-radius:18px;background:var(--s1);font-weight:700;font-size:14px;text-align:center}
.photo{display:flex;align-items:center;gap:12px}
.photo .pv{width:64px;height:80px;background:var(--s1);border-radius:10px;overflow:hidden;display:grid;place-items:center;color:var(--faint);font-size:11px}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:22px;font-weight:600;font-size:14px;animation:fade .2s;max-width:90vw;text-align:center}
.skel{height:84px;margin:0 16px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,transparent,rgba(0,0,0,.04),transparent);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:.5}}@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
[hidden]{display:none!important}
/* ===== 코트 한눈에 · 야외 코트 디자인 =====
   바탕은 코트 바닥 옆 보도블록 같은 서늘한 회녹색, 코트는 한강 코트의 초록, 선은 흰 페인트, 강조는 농구공 주황 하나.
   숫자와 제목은 전광판 같은 Black Han Sans, 본문은 Pretendard. */
:root{
  --paper:#eef1ec;--sheet:#fff;--court:#2f6b4f;--court-2:#285c44;--paint:#fff;--ball:#f26b1d;--ball-ink:#c4500d;
  --ink:#1b2420;--sub:#5f6b64;--faint:#a3aca6;--rule:#d9dfd8;--s1:#e4e9e3;--s2:#d6ddd5;
  --accent:var(--ball);--accent-soft:#fdebdf;
  --calm:#16924f;--calm-soft:#dff3e7;--mid:#c98500;--mid-soft:#fbf0d6;--busy:#d23a2a;--busy-soft:#fbe3df;--unk:#7d8882;--unk-soft:#e6eae5;
  --disp:"Black Han Sans","Pretendard Variable",Pretendard,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)
}
html,body,.app{background:var(--paper)}
@media (min-width:520px){body{background:#dfe4de}.app{box-shadow:0 0 0 1px #d3dad2}}
.top{background:rgba(238,241,236,.88);padding-top:calc(12px + env(safe-area-inset-top))}
.brand{font-family:var(--disp);font-weight:400;font-size:22px;letter-spacing:-.02em;gap:8px}
.brand .logo{width:26px;height:26px;flex:none}
.ttl{font-family:var(--disp);font-weight:400;font-size:19px;letter-spacing:-.01em}
.ib.me{background:var(--sheet);border:1px solid var(--rule)}
.ib.spin svg{animation:spin .7s linear infinite}
.h1{font-family:var(--disp);font-weight:400;font-size:32px;line-height:1.18;letter-spacing:-.02em;margin-top:12px}
.lead{line-height:1.65}
.sec h3{font-family:var(--disp);font-weight:400;font-size:21px;letter-spacing:-.01em}
.sec h3 em{font-family:var(--disp)}
.n,.cnum,.bigrow b,.gt b,.stats b,.step output{font-family:var(--disp);font-weight:400}

/* 홈: 코트 한 면을 위에서 본 그림이 주인공 */
.hero{display:block;margin:6px 16px 0;padding:18px 18px 16px;border-radius:24px;background:var(--court);color:var(--paint);cursor:pointer;position:relative;overflow:hidden}
.hero:active{transform:scale(.99)}
.hero .live{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;opacity:.9}
.hero .live i{width:8px;height:8px;border-radius:50%;background:#7ff0a8;box-shadow:0 0 0 0 rgba(127,240,168,.6);animation:pulse 2s infinite}
.hero h2{margin:6px 0 0;font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.15;letter-spacing:-.02em}
.court{display:block;width:100%;height:auto;margin:14px 0 12px}
.court .ln{fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.4}
.court .floor{fill:var(--court-2)}
.court .pl{fill:var(--ball);stroke:#fff;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:drop .5s var(--spring) both;animation-delay:var(--d)}
.court .pl.me{fill:#fff;stroke:var(--ball)}
.hero .row{display:flex;align-items:flex-end;gap:10px}
.hero .big{font-family:var(--disp);font-size:52px;line-height:.9;letter-spacing:-.02em}
.hero .big small{font-size:20px;margin-left:2px}
.hero .row .tag{background:#fff;margin-bottom:6px}
.hero .row .where{margin:0 0 7px auto;font-size:13px;opacity:.85}
.hero .says{margin:12px 0 0;padding-top:12px;border-top:1px dashed rgba(255,255,255,.35);font-size:13.5px;line-height:1.5;opacity:.92}
.hero .says b{font-family:var(--disp);font-weight:400;font-size:16px}
.hero.empty-court h2{font-size:24px}

/* 검색 */
.search{display:flex;align-items:center;gap:10px;margin:16px 16px 0;height:50px;padding:0 12px 0 15px;border-radius:14px;background:var(--sheet);border:1.5px solid var(--rule);transition:border-color .15s}
.search:focus-within{border-color:var(--ink)}
.search>svg{width:20px;height:20px;color:var(--sub);flex:none}
.search input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:16px;height:100%}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{display:none}
.search button{width:28px;height:28px;border-radius:50%;background:var(--s1);display:grid;place-items:center;flex:none}
.search button svg{width:14px;height:14px}
.chips{padding:12px 16px 2px}
.chip{background:transparent;border:1.5px solid var(--s2);color:var(--ink);transition:background .15s,color .15s,border-color .15s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.acc.on{background:var(--ball);border-color:var(--ball);color:#fff}
.chip svg{width:14px;height:14px;opacity:.55}
.lhead{display:flex;justify-content:space-between;margin:18px 16px 4px;font-size:13px;color:var(--sub);font-weight:600}
.lhead b{color:var(--ink);font-family:var(--disp);font-weight:400;font-size:15px}

/* 코트 목록: 카드 대신 전광판 숫자가 붙은 줄 */
.list{padding:0 16px}
.list .crow{display:grid;grid-template-columns:52px 1fr auto;gap:2px 12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule);background:none;border-radius:0;transition:transform .15s var(--ease)}
.list .crow:active{transform:translateX(4px);background:none}
.crow .num{grid-row:1/3;font-family:var(--disp);font-size:34px;line-height:1;text-align:center}
.crow .num small{display:block;font-family:"Pretendard Variable",Pretendard,sans-serif;font-size:11px;font-weight:700;margin-top:3px;letter-spacing:0}
.crow .nm{font-weight:700;font-size:16.5px;letter-spacing:-.035em;min-width:0}
.crow .sub{grid-column:2;font-size:12.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 10px}
.crow .sub em{font-style:normal;color:var(--ball-ink);font-weight:700}
.crow .tag{grid-row:1/3;grid-column:3}
.crow .dots{grid-column:2/4;display:flex;gap:4px;margin-top:8px}
.crow .dots i{width:9px;height:9px;border-radius:50%;background:var(--s2)}
.crow .dots i.f{background:currentColor}
.list>.empty{padding:40px 8px}
.skel{height:78px;margin:0;border:0;border-bottom:1px solid var(--rule);border-radius:0;background-color:transparent}
.notes{color:var(--sub)}

/* 게임·착장: 흰 종이 한 장씩, 그림자 대신 얇은 선 */
.cards{display:grid;gap:10px;padding:0 16px;margin-top:10px}
.cards>.game,.cards>.fit{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px}
.cards>.empty{background:none}
.gt b{font-size:26px;letter-spacing:-.01em}
.pbar{height:6px;border-radius:3px;background:var(--s1)}
.pbar i{background:var(--ball);transition:width .6s var(--ease)}
.b.p{background:var(--ball);border-color:var(--ball)}
.b:active,.btn:active,.like:active{transform:scale(.97)}
.like.on svg{animation:pop .35s var(--spring)}
.shoe{font-family:var(--disp);font-weight:400;font-size:21px;letter-spacing:-.01em}
.sep{height:0;background:none;margin:12px 0 0}
.sec{margin-top:26px}

/* 코트 상세 */
.sum{background:var(--court);color:var(--paint);border-radius:24px;margin-top:6px}
.sum .area{color:rgba(255,255,255,.8)}
.sum .tag{background:#fff}
.bigrow b{font-size:84px;line-height:.85;letter-spacing:-.02em;color:#fff!important}
.bigrow span{color:rgba(255,255,255,.75)}
.sum .seg i{background:rgba(255,255,255,.18)}
.sum .seg i.f{background:#fff}
.fresh{color:rgba(255,255,255,.82)}
.sum .tag.acc{background:rgba(255,255,255,.16);color:#fff}
.btn{background:var(--ball);border-radius:14px;transition:transform .12s,background .2s}
.btn.dark{background:var(--ink)}
.btn.line{background:var(--sheet);border:1.5px solid var(--rule)}
.links a,.links span{background:var(--sheet);border:1.5px solid var(--rule)}
.kv,.rank,.guide{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:0 16px;margin-left:16px;margin-right:16px}
.guide{padding:0}.guide div+div{border-top:1px solid var(--rule)}
.kv dt:nth-last-child(2),.kv dd:last-child,.rk:last-child{border-bottom:0}
.chart{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 14px 10px;height:130px}
.chart i{background:var(--s2);transform-origin:bottom;animation:grow .6s var(--ease) both}
.chart i.on{background:var(--ball)}
.dates{background:rgba(238,241,236,.94)}
.dt.on{background:var(--ink)}
.dt.on span,.dt.on b{color:var(--paper)}
.fab{background:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(27,36,32,.28)}
.fab:active{transform:scale(.96)}
.nav>div{background:rgba(255,255,255,.95);border-top:1px solid var(--rule);box-shadow:none}
.nav button{transition:color .15s}
.nav button.on{color:var(--ink)}
.nav button.on svg{color:var(--ball);animation:pop .35s var(--spring)}
.sheet{border-radius:24px 24px 0 0}
.in:focus{border-color:var(--ink)}
.opts button.on{background:var(--accent-soft);border-color:var(--ball);color:var(--ball-ink)}
.toast{border-radius:14px;background:var(--ink);animation:toast .35s var(--spring)}

/* 화면 전환·체크인 축하 */
#view.enter{animation:enter .28s var(--ease)}
.ballfx{position:fixed;z-index:95;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;animation:bounce .9s cubic-bezier(.3,0,.7,1) forwards}
.ballfx svg{width:100%;height:100%;animation:spin .9s linear}
@keyframes drop{from{transform:translateY(-26px) scale(.4);opacity:0}}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(127,240,168,0)}100%{box-shadow:0 0 0 0 rgba(127,240,168,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{40%{transform:scale(1.3)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px) scale(.96)}}
@keyframes bounce{0%{transform:translateY(-120px);opacity:0}15%{opacity:1}40%{transform:translateY(0)}58%{transform:translateY(-46px)}74%{transform:translateY(0)}86%{transform:translateY(-14px)}100%{transform:translateY(0);opacity:0}}
/* 착장 카드: 폰 한 화면에 여러 개 보이도록 작은 사진 + 글 */
.cards>.fit{display:grid;grid-template-columns:76px 1fr;gap:0 14px;padding:14px}
.fit .ph{grid-row:1;width:76px;height:96px;margin:0;border-radius:12px;background:var(--s1);overflow:hidden;display:grid;place-items:center;color:var(--faint);aspect-ratio:auto}
.fit .ph svg{width:30px;height:30px}
.fit .ph img{width:100%;height:100%;object-fit:cover}
.fit .fx{min-width:0;align-self:center}
.fit .shoe{font-size:18px;line-height:1.25}
.fit .shoe small{font-family:"Pretendard Variable",Pretendard,sans-serif;font-size:12px;margin-left:6px}
.fit .grip{margin-top:5px}
.fit .grip i{width:16px;height:5px}
.fit .wear{margin:5px 0 0;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fit .quote{margin:6px 0 0;padding:0;background:none;font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fit .quote:before{content:"“";color:var(--ball);font-weight:800;margin-right:2px}
.fit .ft{grid-column:1/3;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.fit .ft .meta a{color:var(--ink);font-weight:600;margin-right:4px}
.fit .like{height:30px;padding:0 11px;font-size:13px}
.bigph{display:block;width:100%;max-height:70dvh;object-fit:contain;border-radius:14px;background:var(--s1)}
.still .pl,.still .chart i{animation:none}
:focus-visible{outline:2.5px solid var(--ball);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* 지도 · 코트 제보 */
.vt{display:inline-flex;background:var(--s1);border-radius:10px;padding:3px;gap:2px}
.vt button{height:30px;padding:0 15px;border-radius:8px;font-weight:700;font-size:13px;color:var(--sub);transition:background .15s,color .15s}
.vt button.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.mapwrap{position:relative;margin:2px 16px 0}
#map{height:min(62dvh,520px);min-height:320px;border-radius:16px;overflow:hidden;border:1.5px solid var(--rule);background:var(--s1);z-index:0}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:14px;text-align:center;padding:24px;z-index:1;pointer-events:none}
.mapcard{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;background:var(--sheet);border:1.5px solid var(--rule);border-radius:14px;padding:12px 14px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:grid;gap:3px}
.mapcard[hidden]{display:none}
.mc-t{display:flex;align-items:center;justify-content:space-between;gap:8px}.mc-t b{font-size:17px;letter-spacing:-.03em}
.mc-s{font-size:13px;color:var(--sub);margin-bottom:8px}
.mk{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;font-size:13px;border:2.5px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.32);transition:transform .15s}
.mk.calm{background:var(--calm)}.mk.mid{background:var(--mid)}.mk.busy{background:var(--busy)}.mk.unk{background:var(--unk)}
.mk.sel{transform:scale(1.25);z-index:999!important}
.mapnote{margin:8px 20px 0;font-size:12.5px;color:var(--sub)}
.suggest{display:block;width:calc(100% - 32px);margin:18px 16px 0;padding:16px;border-radius:14px;border:1.5px dashed var(--s2);text-align:center;color:var(--sub);font-size:14px;line-height:1.5}
.suggest b{display:block;color:var(--ink);font-size:15px;margin-top:2px}
.pickmap{height:210px;border-radius:12px;overflow:hidden;border:1.5px solid var(--rule);background:var(--s1);z-index:0}
.pk-on{color:var(--calm);font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="top" id="top"></div>
  <main id="view"></main>
</div>
<button class="fab" id="fab" hidden></button>
<nav class="nav"><div id="nav"></div></nav>

<script>
// 모든 경로는 상대 경로 (공개/프록시 주소 앞에 접두사가 붙기 때문)
const $ = s => document.querySelector(s);
const view = $('#view');
const S = (d, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  court: S('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.6"/>'),
  game: S('<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  fit: S('<path d="M3 15.5c0-1.6.9-2.6 2.6-2.8L9 9l2.8 2 4.7 1.1c2.2.5 4.5 1.4 4.5 4.1V18H3z"/><path d="M9 9l-.7 3.4"/>'),
  me: S('<circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c.8-3.8 3.7-6 7.5-6s6.7 2.2 7.5 6"/>'),
  back: S('<path d="M15 5l-7 7 7 7"/>', 2.2),
  share: S('<path d="M12 15V3.5M7.5 8L12 3.5 16.5 8M5 12.5V19a1 1 0 001 1h12a1 1 0 001-1v-6.5"/>'),
  refresh: S('<path d="M20 11a8 8 0 10-2.4 5.7M20 4.5V11h-6.5"/>'),
  heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/></svg>',
  plus: S('<path d="M12 5v14M5 12h14"/>', 2.6),
  search: S('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>', 2),
  pin: S('<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'),
  x: S('<path d="M6 6l12 12M18 6L6 18"/>', 2.2)
};
const LOGO = '<svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#e8470c"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 6.5v19M6.5 16h19M9.3 9.3c3.6 3.2 3.6 10.2 0 13.4M22.7 9.3c-3.6 3.2-3.6 10.2 0 13.4" fill="none" stroke="#fff" stroke-width="1.6"/></svg>';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let nickname = ''; try { nickname = localStorage.getItem('nick') || ''; } catch (e) {}
// 이 기기만의 비밀 키: 닉네임을 처음 쓴 기기에만 묶어서 다른 사람이 같은 닉네임으로 글을 지우지 못하게 한다
let nickKey = ''; try { nickKey = localStorage.getItem('nickKey') || ''; } catch (e) {}
if (!nickKey) {
  const b = new Uint8Array(24); crypto.getRandomValues(b);
  nickKey = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  try { localStorage.setItem('nickKey', nickKey); } catch (e) {}
}
const setNick = n => { nickname = n; try { localStorage.setItem('nick', n); } catch (e) {} };

async function api(path, method = 'GET', body) {
  let r;
  if (method !== 'GET') body = {...(body || {}), key: nickKey};
  try { r = await fetch(path, {method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined}); }
  catch (e) { throw new Error('서버에 연결할 수 없어요'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : '요청에 실패했어요');
  return d;
}
function toast(m) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2400); }
const ago = m => m == null ? '' : m < 1 ? '방금' : m < 60 ? `${m}분 전` : m < 1440 ? `${Math.floor(m / 60)}시간 전` : `${Math.floor(m / 1440)}일 전`;
// 한국 시간 기준 날짜 (UTC 필드에 +9h 를 더해서 읽는다)
const kst = (add = 0) => new Date(Date.now() + 9 * 36e5 + add * 864e5);
const ymd = d => d.toISOString().slice(0, 10);
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const fmtDate = s => { const d = new Date(s + 'T00:00:00Z'); return `${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일 (${WD[d.getUTCDay()]})`; };

/* ---------- 시트 ---------- */
let sheetOpen = false;
function openSheet(html, bind) {
  closeSheet();
  const v = document.createElement('div'); v.className = 'veil'; v.id = 'veil';
  v.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  v.addEventListener('mousedown', e => { if (e.target === v) closeSheet(); });
  document.body.append(v); sheetOpen = true; bind && bind(v.firstChild);
}
function closeSheet() { const v = $('#veil'); if (v) v.remove(); sheetOpen = false; }
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
// 버튼 묶음(단일 선택)
function opts(el, list, val, onPick) {
  el.innerHTML = list.map(x => `<button data-v="${esc(x)}" class="${x === val ? 'on' : ''}">${esc(x)}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); onPick(b.dataset.v); });
}

let age14 = false; try { age14 = localStorage.getItem('age14') === '1'; } catch (e) {}
function nickSheet(then) {
  openSheet(`<h4>닉네임 정하기</h4><div class="sub">코트에서 서로 부를 이름입니다. 가입은 필요하지 않습니다.</div>
    <label class="field"><span>닉네임 (최대 20자)</span><input class="in" id="ni" maxlength="20" value="${esc(nickname)}" placeholder="예) 슛돌이" autocomplete="off"></label>
    ${age14 ? '' : `<label style="display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px;color:var(--sub);cursor:pointer">
      <input type="checkbox" id="na" style="width:20px;height:20px;accent-color:var(--accent);flex:none"> 만 14세 이상입니다</label>`}
    <div style="height:18px"></div><button class="btn" id="ns">저장</button>`, s => {
    const go = async () => {
      const v = s.querySelector('#ni').value.trim(); if (!v) return toast('닉네임을 입력해 주세요');
      const a = s.querySelector('#na'); if (a && !a.checked) return toast('만 14세 이상만 이용할 수 있어요');
      try { await api('api/nick', 'POST', {nickname: v}); } catch (e) { return toast(e.message); }
      if (a) { age14 = true; try { localStorage.setItem('age14', '1'); } catch (e) {} }
      setNick(v); closeSheet(); render(); then && then();
    };
    s.querySelector('#ns').onclick = go; s.querySelector('#ni').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); go(); } }; s.querySelector('#ni').focus();
  });
}
const withNick = fn => nickname && age14 ? fn() : nickSheet(fn);   // 기존 이용자도 한 번은 나이 확인
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(root) {
  if (calm) return;
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, small = el.querySelector('small'), t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 650), v = Math.round(to * (1 - Math.pow(1 - k, 3)));
      el.firstChild.nodeValue = v; if (k < 1) requestAnimationFrame(step); };
    if (el.firstChild && el.firstChild.nodeType === 3) requestAnimationFrame(step);
  });
}
function bounceBall(from) {
  try { navigator.vibrate && navigator.vibrate([18, 40, 18]); } catch (e) {}
  if (calm || !from) return;
  const r = from.getBoundingClientRect(), b = document.createElement('div');
  b.className = 'ballfx'; b.style.left = (r.left + r.width / 2) + 'px'; b.style.top = (r.top - 8) + 'px';
  b.innerHTML = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#f26b1d"/><path d="M16 1v30M1 16h30M5.5 5.5c4.6 4.2 4.6 16.8 0 21M26.5 5.5c-4.6 4.2-4.6 16.8 0 21" fill="none" stroke="#7a2f08" stroke-width="1.6"/></svg>';
  document.body.append(b); setTimeout(() => b.remove(), 1000);
}
async function act(fn, okMsg) { try { await fn(); okMsg && toast(okMsg); await render(); } catch (e) { toast(e.message); } }

/* ---------- 조각 ---------- */
function status(c) {
  const known = c.checked_in > 0 || c.reported !== null;
  return known ? {key: c.key, label: c.label, hint: c.hint, known} : {key: 'unk', label: '정보 없음', hint: '첫 제보를 남겨 주세요', known};
}
// 코트 한 면을 위에서 본 그림. 사람 수만큼 점을 찍는다(위치는 코트 id 로 고정된 난수).
function courtSVG(c, st, mine) {
  const n = st.known ? Math.min(c.people, 24) : 0;
  let seed = [...c.id].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7);
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const dots = Array.from({length: n}, (_, i) => {
    const x = 22 + rnd() * 256, y = 16 + rnd() * 118;
    return `<circle class="pl ${mine && i === n - 1 ? 'me' : ''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" style="--d:${120 + i * 45}ms"/>`;
  }).join('');
  return `<svg class="court" viewBox="0 0 300 150" role="img" aria-label="${st.known ? `코트에 ${c.people}명` : '아직 제보 없음'}">
    <rect class="floor" x="6" y="6" width="288" height="138" rx="6"/>
    <g class="ln"><rect x="12" y="12" width="276" height="126" rx="2"/><path d="M150 12v126"/><circle cx="150" cy="75" r="17"/>
    <rect x="12" y="52" width="46" height="46"/><rect x="242" y="52" width="46" height="46"/><circle cx="58" cy="75" r="12"/><circle cx="242" cy="75" r="12"/>
    <path d="M12 24h20a51 51 0 010 102H12M288 24h-20a51 51 0 000 102h20"/></g>${dots}</svg>`;
}
const seg = (c, st, lg) => `<div class="seg ${st.key} ${lg ? 'lg' : ''}" aria-label="현재 ${c.people}명">${Array.from({length: 10}, (_, i) => `<i class="${i < Math.min(c.people, 10) ? 'f' : ''}"></i>`).join('')}</div>`;
function freshness(c) {
  const p = [];
  if (c.checked_in) p.push(`체크인 ${c.checked_in}명`);
  if (c.reported !== null) p.push(`제보 ${c.reported}명 · ${ago(c.report_ago)}`);
  return p.join('  ·  ') || '아직 제보가 없어요';
}
function courtRow(c) {
  const st = status(c), info = st.known ? [c.checked_in ? `체크인 ${c.checked_in}명` : '', c.reported !== null ? `제보 ${ago(c.report_ago)}` : ''].filter(Boolean) : ['아직 제보 없음'];
  return `<button class="crow" data-go="c/${c.id}">
    <span class="num ${st.key}">${st.known ? c.people : '–'}<small>${st.known ? '명' : ''}</small></span>
    <span class="nm">${esc(c.name)}</span><span class="tag ${st.key}">${st.label}</span>
    <span class="sub"><span>${esc(c.district || c.area)}</span>${info.map(x => `<span>${x}</span>`).join('')}${c.open_posts ? `<em>게임 ${c.open_posts}개 모집 중</em>` : ''}</span>
    <span class="dots ${st.key}" aria-hidden="true">${Array.from({length: 10}, (_, i) => `<i class="${i < Math.min(c.people, 10) ? 'f' : ''}"></i>`).join('')}</span></button>`;
}

function gstate(p) {
  const left = p.capacity - p.joined.length, now = ymd(kst()) + ' ' + kst().toISOString().slice(11, 16);
  if (p.play_at && p.play_at <= now) return {key: 'unk', label: '진행중', left};
  if (left <= 0) return {key: 'unk', label: '마감', left};
  if (left <= 2) return {key: 'busy', label: '마감임박', left};
  return {key: 'acc', label: '모집중', left};
}
function gameCard(p, showDate) {
  const g = gstate(p), mine = nickname && p.joined.includes(nickname), owner = nickname && p.nickname === nickname, full = g.left <= 0;
  const [d, t] = (p.play_at || ' ').split(' ');
  return `<article class="game"><div class="g1">
    <div class="gt"><b class="n">${esc(t || p.when_text)}</b>${showDate && d ? `<span>${esc(fmtDate(d).replace(/^\d+월 /, ''))}</span>` : ''}</div>
    <div class="gm"><h4>${esc(p.title)}</h4>
      <div class="meta"><a href="#/c/${esc(p.court_id)}">${esc(p.court_name)}</a></div>
      <div class="tg">${p.fmt ? `<span class="tag">${esc(p.fmt)}</span>` : ''}${p.level ? `<span class="tag">${esc(p.level)}</span>` : ''}</div></div>
    <div class="gs"><span class="tag ${g.key}">${g.label}</span><small><b class="n">${p.joined.length}</b>/${p.capacity}명</small></div></div>
    <div class="pbar ${full ? 'full' : ''}"><i style="width:${Math.min(100, p.joined.length / p.capacity * 100)}%"></i></div>
    <div class="names">${p.joined.map(esc).join(', ')} <span style="color:var(--faint)">· ${esc(p.nickname)} 모집 · ${ago(p.ago)}</span></div>
    <div class="acts">
      ${mine ? `<button class="b g" data-pid="${p.id}" data-act="leave">참가 취소</button>` : `<button class="b p" ${full || g.label === '진행중' ? 'disabled style="opacity:.4"' : ''} data-pid="${p.id}" data-act="join">${full ? '마감되었습니다' : '참가하기'}</button>`}
      ${p.link ? `<a class="b" href="${esc(p.link)}" target="_blank" rel="noopener noreferrer">오픈채팅</a>` : ''}
      ${owner ? `<button class="b t" data-pid="${p.id}" data-act="delete">삭제</button>` : ''}
    </div></article>`;
}

let courts = [], filter = '전체', query = '', fresh = true, mode = 'list';   // fresh: 화면에 처음 들어왔을 때만 효과를 보여 준다
async function loadCourts() { courts = await api('api/courts'); return courts; }
const norm = t => String(t || '').replace(/\s+/g, '').toLowerCase();

function chart(h) {
  if (h.samples < 5) return `<p class="hint">기록이 더 필요합니다 (${h.samples}/5). 체크인과 제보가 쌓이면 시간대별 혼잡도를 보여드립니다.</p>`;
  const now = (new Date().getUTCHours() + 9) % 24, mx = Math.max(...h.hours, 1), hs = [...Array(19).keys()].map(i => i + 5);
  return `<div class="chart">${hs.map(x => `<i class="${x === now ? 'on' : ''}" style="height:${Math.max(4, h.hours[x] / mx * 100)}%" title="${x}시 평균 ${h.hours[x]}명"></i>`).join('')}</div>
    <div class="axis"><span>5시</span><span>12시</span><span>18시</span><span>23시</span></div>`;
}

function compress(file, max = 960) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', .78));   // 재인코딩하므로 위치 등 EXIF 정보는 제거돼요
    };
    img.onerror = () => rej(new Error('사진을 읽을 수 없어요')); img.src = url;
  });
}

  box.hidden = false;
  box.innerHTML = `<div class="mc-t"><b>${esc(c.name)}</b><span class="tag ${st.key}">${st.label}</span></div>
    <div class="mc-s">${esc(c.district || c.area)} · ${st.known ? `지금 ${c.people}명` : '아직 제보 없음'}${c.open_posts ? ` · 게임 ${c.open_posts}개 모집 중` : ''}</div>
    <button class="btn sm" data-go="c/${esc(c.id)}">자세히 보기</button>`;
  box.querySelector('[data-go]').onclick = () => { location.hash = '#/c/' + c.id; };
}
async function showMap(list) {
  const box = $('#cl');
  if (!$('#map')) {
    destroyMap();
    box.innerHTML = '<div class="mapwrap"><div id="map" role="application" aria-label="코트 지도"></div><p class="mapmsg" id="mm">지도를 불러오는 중…</p><div class="mapcard" id="mc" hidden></div></div><p class="mapnote" id="mn"></p>';
  }
  let L; try { L = await loadLeaflet(); } catch (e) { const m = $('#mm'); if (m) m.textContent = '지도를 불러오지 못했어요. 목록으로 볼 수 있어요.'; return; }
  if (!$('#map') || mode !== 'map') return;   // 기다리는 사이 화면이 바뀜
  if (!mapInst) {
    mapInst = L.map('map', {zoomControl: true}).setView(SEOUL, 11);
    L.tileLayer(OSM.url, OSM.opt).addTo(mapInst); mapLayer = L.layerGroup().addTo(mapInst);
    mapInst.on('click', () => { const b = $('#mc'); if (b) b.hidden = true; });
  }
  const mm = $('#mm'); if (mm) mm.remove();
  mapLayer.clearLayers();
  const pts = list.filter(c => c.lat != null && c.lng != null), markers = [];
  pts.forEach(c => { const m = L.marker([c.lat, c.lng], {icon: pinIcon(L, c), title: c.name, riseOnHover: true}); m._court = c; m.on('click', e => { if (e.originalEvent) L.DomEvent.stopPropagation(e); selectCourt(L, c, markers); }); m.addTo(mapLayer); markers.push(m); });
  if (pts.length) mapInst.fitBounds(L.latLngBounds(pts.map(c => [c.lat, c.lng])), {padding: [44, 44], maxZoom: 15});
  const b = $('#mc'); if (b) b.hidden = true;
  const none = list.length - pts.length, n = $('#mn');
  if (n) n.textContent = !list.length ? '' : !pts.length ? '이 코트들은 아직 지도 위치가 없어요. 목록으로 봐 주세요.' : none ? `지도 위치가 아직 없는 코트 ${none}곳은 목록에서 볼 수 있어요.` : '핀의 숫자는 지금 인원이에요. 위치는 공원·시설 기준 대략적인 위치예요.';
  setTimeout(() => mapInst && mapInst.invalidateSize(), 60);
}

/* ---------- 코트 제보 ---------- */
async function suggestSheet() {
  let pt = null, pm = null;
  openSheet(`<h4>코트 제보하기</h4><div class="sub">목록에 없는 농구장을 알려 주세요. 운영자가 확인한 뒤 지도와 목록에 올라가요.</div>
    <label class="field"><span>코트 이름 *</span><input class="in" id="sn" maxlength="30" placeholder="예) 광교호수공원 농구장"></label>
    <div class="two"><label class="field"><span>지역 *</span><input class="in" id="sd" maxlength="12" placeholder="예) 수원시, 마포구"></label>
    <label class="field"><span>바닥</span><select class="in" id="ss"><option value="">모름</option><option>고무</option><option>우레탄</option><option>아스팔트</option><option>마루</option><option>기타</option></select></label></div>
    <label class="field"><span>주소·찾아가는 법</span><input class="in" id="sa" maxlength="60" placeholder="예) 광교호수로 57 옆 주차장 뒤"></label>
    <div class="two"><label class="field"><span>골대 수</span><input class="in" id="sh" maxlength="30" placeholder="예) 골대 4개"></label>
    <label class="field"><span>메모</span><input class="in" id="so" maxlength="80" placeholder="조명·화장실 등"></label></div>
    <div class="field"><span>지도에서 위치 고르기 (선택)</span><div class="pickmap" id="pk"></div><p class="hint" id="pkh" style="margin:6px 0 0">코트가 있는 곳을 눌러 핀을 꽂아 주세요. 핀을 끌어서 옮길 수도 있어요.</p></div>
    <p class="hint" style="margin:12px 0 0">직접 확인한 정보만 적어 주세요. 다른 사이트나 블로그의 글·사진은 옮기지 말고, 전화번호 같은 개인정보는 쓰지 마세요.</p>
    <div style="height:18px"></div><button class="btn" id="sg">제보하기</button>`, s => {
    s.querySelector('#sn').focus();
    loadLeaflet().then(L => {
      const el = s.querySelector('#pk'); if (!el) return;
      const c = mapInst ? mapInst.getCenter() : null, map = L.map(el, {zoomControl: true}).setView(c ? [c.lat, c.lng] : SEOUL, c ? Math.max(mapInst.getZoom(), 13) : 11);
      L.tileLayer(OSM.url, OSM.opt).addTo(map);
      const put = ll => {
        pt = {lat: +ll.lat.toFixed(6), lng: +ll.lng.toFixed(6)};
        if (!pm) { pm = L.marker(ll, {draggable: true}).addTo(map); pm.on('dragend', () => put(pm.getLatLng())); } else pm.setLatLng(ll);
        const h = s.querySelector('#pkh'); if (h) { h.textContent = '위치를 골랐어요'; h.className = 'hint pk-on'; h.style.margin = '6px 0 0'; }
      };
      map.on('click', e => put(e.latlng));
      setTimeout(() => map.invalidateSize(), 80);
    }).catch(() => { const el = s.querySelector('#pk'); if (el) { el.style.display = 'grid'; el.style.placeItems = 'center'; el.textContent = '지도를 불러오지 못했어요. 주소로 적어 주세요.'; } });
    s.querySelector('#sg').onclick = () => {
      const v = id => s.querySelector('#' + id).value.trim();
      if (v('sn').length < 2) return toast('코트 이름을 입력해 주세요');
      if (!v('sd')) return toast('지역을 입력해 주세요 (예: 마포구)');
      if (!pt && !v('sa')) return toast('지도에서 위치를 고르거나 주소를 적어 주세요');
      api('api/suggest', 'POST', {nickname, name: v('sn'), district: v('sd'), address: v('sa'), hoops: v('sh'), surface: v('ss'), note: v('so'), lat: pt ? pt.lat : null, lng: pt ? pt.lng : null})
        .then(() => { closeSheet(); toast('제보했어요. 확인 후 올라가요'); }).catch(e => toast(e.message));
    };
  });
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
